# yaml-language-server: $schema=https://www.schemastore.org/traefik-v3-file-provider.json

http:
  middlewares:
    default-headers:
      headers:
        customFrameOptionsValue: SAMEORIGIN
        customRequestHeaders:
          X-Forwarded-Proto: https

    default-allowlist:
      ipAllowList:
        sourceRange:
          # yaml-language-server-disable
          {{- $ranges := env "ALLOWED_IP_RANGES" | default "10.10.0.0/24" }}{{ range split $ranges "," }}
          - {{ . | trim }}
          {{- end }}
