# yaml-language-server: $schema=https://www.schemastore.org/traefik-v3.json

global:
  sendAnonymousUsage: false

certificatesResolvers:
  letsencrypt:
    acme:
      dnsChallenge:
        provider: cloudflare
        resolvers:
          - 1.1.1.1:53
          - 1.0.0.1:53
      storage: /etc/letsencrypt/acme.json

entryPoints:
  http:
    address: :80
    http:
      # New directive since Traefik v3.7.12
      # yaml-language-server-disable Property aliasHeadersStrategy is not allowed
      aliasHeadersStrategy: delete
      redirections:
        entryPoint:
          to: https
          scheme: https
  https:
    address: :443
    http:
      # yaml-language-server-disable Property aliasHeadersStrategy is not allowed
      aliasHeadersStrategy: delete
      middlewares:
        - default-allowlist@file
        - default-headers@file
      tls:
        certResolver: letsencrypt

providers:
  docker:
    endpoint: unix:///var/run/docker.sock
    exposedByDefault: false
    network: shared

  file:
    directory: /etc/traefik/providers
    watch: true

api:
  dashboard: true

# Metrics configuration
metrics:
  otlp:
    grpc:
      endpoint: "grafana-tempo:4317"
      insecure: true
    # For HTTP instead of gRPC, use:
    # http:
    #   endpoint: "grafana-tempo:4318"
  prometheus:
    # Enable Prometheus metrics endpoint
    addEntryPointsLabels: true
    addServicesLabels: true
    buckets: [0.1, 0.3, 1.2, 5.0]
    # The metrics will be available at /metrics on the API port (8080)

# Distributed tracing configuration
tracing:
  serviceName: traefik
  otlp:
    grpc:
      endpoint: "grafana-tempo:4317"
      insecure: true
    # For HTTP instead of gRPC, use:
    # http:
    #   endpoint: "grafana-tempo:4318"

ping:
  entryPoint: http

log:
  format: json
  level: INFO

accessLog:
  # Send access logs to stdout for Docker/Alloy collection
  format: json
  filters:
    statusCodes:
      - "400-404"
      - "500-503"
    retryAttempts: true
    minDuration: 10ms
  fields:
    names:
      StartUTC: drop
      ClientUsername: keep

serversTransport:
  insecureSkipVerify: true
