x-arcane:
  icon: grafana

x-environment: &environment
  TZ: ${TZ:-}

x-deploy: &deploy
  resources:
    limits:
      cpus: '1.0'
      memory: 512m
    reservations:
      cpus: '0.1'
      memory: 128m

x-healthcheck: &healthcheck
  interval: 10s
  timeout: 5s
  retries: 3
  start_period: 10s

services:
  grafana:
    image: docker.io/grafana/grafana:13.2
    container_name: grafana
    restart: unless-stopped
    user: '0'
    depends_on:
      loki:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      grafana-tempo:
        condition: service_healthy
      grafana-alloy:
        condition: service_healthy
      grafana-db:
        condition: service_healthy
    environment:
      <<: *environment
      GF_DATABASE_TYPE: postgres
      GF_DATABASE_HOST: grafana-db:5432
      GF_DATABASE_NAME: ${GF_DATABASE_NAME:-grafana}
      GF_DATABASE_USER: ${GF_DATABASE_USER:-grafana}
      GF_DATABASE_PASSWORD: ${GF_DATABASE_PASSWORD:-secret}
      GF_DATABASE_SSL_MODE: disable

      GF_SECURITY_ADMIN_EMAIL: admin@${ROOT_DOMAIN:-homelab.lan}
      # GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - ./config/grafana:/etc/grafana:ro
      - ./data/grafana:/var/lib/grafana
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: [CMD-SHELL, wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1]
      <<: *healthcheck
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1g
        reservations:
          cpus: '0.2'
          memory: 256m
    labels:
      arcane.icon: grafana
      dockhand.order: -1
      prometheus.port: 3000
      prometheus.path: /metrics
      traefik.enable: true
      traefik.http.routers.grafana.entrypoints: https
      traefik.http.routers.grafana.observability.accessLogs: false
      traefik.http.routers.grafana.rule: Host(`${GRAFANA_DOMAIN:-grafana.${ROOT_DOMAIN:-homelab.lan}}`)
      traefik.http.services.grafana.loadbalancer.server.port: 3000

  prometheus:
    image: docker.io/prom/prometheus:v3
    container_name: prometheus
    restart: unless-stopped
    user: '0'
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --web.enable-lifecycle
      - --web.enable-remote-write-receiver
    environment:
      <<: *environment
    volumes:
      - ./config/prometheus:/etc/prometheus
      - ./data/prometheus:/prometheus/data
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: [CMD-SHELL, wget --no-verbose --tries=1 --spider http://localhost:9090/-/healthy || exit 1]
      <<: *healthcheck
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1g
        reservations:
          cpus: '0.2'
          memory: 256m
    labels:
      arcane.icon: prometheus
      prometheus.port: 9090
      prometheus.path: /metrics
      traefik.enable: true
      traefik.http.routers.prometheus.entrypoints: https
      traefik.http.routers.prometheus.observability.accessLogs: false
      traefik.http.routers.prometheus.rule: Host(`${PROMETHEUS_DOMAIN:-prometheus.${ROOT_DOMAIN:-homelab.lan}}`)
      traefik.http.services.prometheus.loadbalancer.server.port: 9090

  grafana-tempo:
    image: docker.io/grafana/tempo:3.0.0
    container_name: grafana-tempo
    restart: unless-stopped
    user: '0'
    depends_on:
      prometheus:
        condition: service_healthy
    command:
      - -config.file=/etc/tempo/config.yaml
    ports:
      # Data ports — OTLP intake for the whole LAN (Web UI stays Traefik-only)
      - ${TEMPO_OTLP_GRPC_PORT:-4317}:4317 # OTLP gRPC
      - ${TEMPO_OTLP_HTTP_PORT:-4318}:4318 # OTLP HTTP
    environment:
      <<: *environment
    volumes:
      - ./config/tempo:/etc/tempo
      - ./data/tempo:/var/lib/tempo
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: [CMD, /tempo, -health]
      <<: *healthcheck
    deploy: *deploy
    labels:
      arcane.icon: tempo
      prometheus.port: 3200
      prometheus.path: /metrics
      traefik.enable: true
      traefik.http.routers.grafana-tempo.entrypoints: https
      traefik.http.routers.grafana-tempo.observability.accessLogs: false
      traefik.http.routers.grafana-tempo.rule: Host(`${TEMPO_DOMAIN:-tempo.${ROOT_DOMAIN:-homelab.lan}}`)
      traefik.http.services.grafana-tempo.loadbalancer.server.port: 3200

  loki:
    image: docker.io/grafana/loki:3.7
    container_name: loki
    restart: unless-stopped
    user: '0'
    command:
      - -config.file=/etc/loki/config.yaml
    environment:
      <<: *environment
    volumes:
      - ./config/loki:/etc/loki:ro
      - ./data/loki:/loki
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: [CMD, /usr/bin/loki, -health]
      <<: *healthcheck
    deploy: *deploy
    labels:
      arcane.icon: loki
      prometheus.port: 3100
      prometheus.path: /metrics

  grafana-alloy:
    image: docker.io/grafana/alloy:v1.9.0
    container_name: grafana-alloy
    restart: unless-stopped
    user: '0'
    ports:
      # Syslog intake (OpenWrt) — the only host-published port besides Tempo OTLP;
      # Alloy's Web UI/metrics is reachable via Traefik only (alloy.<domain>)
      - ${ALLOY_SYSLOG_PORT:-514}:514/udp
    command: [run, --server.http.listen-addr=0.0.0.0:12345, /etc/alloy/config.alloy]
    depends_on:
      loki:
        condition: service_healthy
      grafana-tempo:
        condition: service_healthy
    environment:
      <<: *environment
    volumes:
      - ./config/alloy:/etc/alloy:ro
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log:/var/log:ro
    healthcheck:
      # The Alloy image has no wget/curl, so probe /-/ready with bash's /dev/tcp
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/12345; printf "GET /-/ready HTTP/1.0\r\n\r\n" >&3; grep -q "200 OK" <&3'
      <<: *healthcheck
    deploy: *deploy
    labels:
      arcane.icon: grafana-alloy
      prometheus.port: 12345
      prometheus.path: /metrics
      traefik.enable: true
      traefik.http.routers.grafana-alloy.entrypoints: https
      traefik.http.routers.grafana-alloy.observability.accessLogs: false
      traefik.http.routers.grafana-alloy.rule: Host(`${ALLOY_DOMAIN:-alloy.${ROOT_DOMAIN:-homelab.lan}}`)
      traefik.http.services.grafana-alloy.loadbalancer.server.port: 12345

  grafana-db:
    image: docker.io/postgres:17.11-alpine
    container_name: grafana-db
    restart: unless-stopped
    environment:
      <<: *environment
      POSTGRES_DB: ${GF_DATABASE_NAME:-grafana}
      POSTGRES_USER: ${GF_DATABASE_USER:-grafana}
      POSTGRES_PASSWORD: ${GF_DATABASE_PASSWORD:-secret}
    volumes:
      - ./data/init-db.sh:/docker-entrypoint-initdb.d/10-init-db.sh:ro
      - ./data/postgres:/var/lib/postgresql/data
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U ${GF_DATABASE_USER:-grafana}"]
      <<: *healthcheck
    deploy: *deploy
    labels:
      arcane.icon: postgresql

networks:
  default:
    name: shared
    external: true
