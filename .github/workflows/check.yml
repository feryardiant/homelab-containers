name: Check
run-name: "check(${{ github.ref_name }}): quality check against `${{ github.sha }}`"

on:
  pull_request:
  # Only verify PRs for now
  # push:
  #   branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  validation:
    name: Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate
        run: bash scripts/validate.sh
